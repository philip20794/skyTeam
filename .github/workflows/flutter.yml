name: Flutter CI and Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyteam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  android:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name skyteam --org de.skyteam .
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build installable APK
        run: flutter build apk --release --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}"
      - name: Publish latest Android APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "SkyTeam Android latest" --notes "Automatisch erstellte APK. Hinweis: Bis ein persistenter Release-Signaturschlüssel eingerichtet ist, muss eine vorherige Installation möglicherweise deinstalliert werden."
          cp build/app/outputs/flutter-apk/app-release.apk SkyTeam.apk
          gh release upload android-latest SkyTeam.apk --clobber
