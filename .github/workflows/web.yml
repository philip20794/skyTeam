name: Build and publish SkyTeam (Web + APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyteam-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android project
        run: flutter create --platforms=android --project-name skyteam --org de.skyteam .

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"

      - name: Verify built APK archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile

          apk = Path("build/app/outputs/flutter-apk/app-release.apk")
          if not apk.exists() or apk.stat().st_size < 1024 * 1024:
              raise SystemExit("APK is missing or unexpectedly small")
          if not is_zipfile(apk):
              raise SystemExit("Android build did not produce a valid APK/ZIP archive")
          with ZipFile(apk) as archive:
              if "AndroidManifest.xml" not in archive.namelist():
                  raise SystemExit("APK does not contain an AndroidManifest.xml")
          print(f"Valid Android APK: {apk.stat().st_size:,} bytes")
          PY

      - name: Build Flutter web
        run: flutter build web --release

      - name: Bundle APK into Firebase Hosting site
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/web/index.html
          mkdir -p build/web/downloads
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/SkyTeam.apk
          test -s build/web/downloads/SkyTeam.apk

      - name: Save APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyTeam-Android-APK
          path: build/web/downloads/SkyTeam.apk
          if-no-files-found: error

      - name: Save web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyTeam-Web
          path: build/web/
          if-no-files-found: error

      - name: Verify Firebase credentials
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUENTER_SKY_TEAM }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_GUENTER_SKY_TEAM. Set it up once with 'firebase init hosting:github', or add the Firebase service-account JSON in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish web app and APK to Firebase Hosting
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUENTER_SKY_TEAM }}
          projectId: guenter-sky-team
          channelId: live

      - name: Verify the public APK matches the built APK
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          apk = Path("build/web/downloads/SkyTeam.apk")
          expected = hashlib.sha256(apk.read_bytes()).hexdigest()
          url = "https://guenter-sky-team.web.app/downloads/SkyTeam.apk?build=" + os.environ["GITHUB_SHA"]

          for attempt in range(1, 5):
              try:
                  request = Request(url, headers={"Cache-Control": "no-cache"})
                  with urlopen(request, timeout=45) as response:
                      digest = hashlib.sha256()
                      size = 0
                      while chunk := response.read(1024 * 1024):
                          digest.update(chunk)
                          size += len(chunk)
                  if digest.hexdigest() == expected:
                      print(f"Public APK verified: {size:,} bytes, SHA-256 matches local build")
                      break
                  print(f"Attempt {attempt}: APK response is not the expected file ({size:,} bytes)")
              except Exception as error:
                  print(f"Attempt {attempt}: public APK unavailable: {error}")
              if attempt == 4:
                  raise SystemExit("Firebase is serving an invalid or outdated APK at /downloads/SkyTeam.apk")
              time.sleep(6)
          PY
